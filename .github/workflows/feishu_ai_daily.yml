name: Daily Feishu AI News Push

on:
  schedule:
    # 国际标准时间 UTC 01:00，即北京时间每天早上 09:00
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击立即触发

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Push Script
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python scripts/feishu_ai_daily/push_feishu.py --limit 20
